services:
  foodflow:
    build: .
    # Local dev bypasses Nginx and runs FastAPI (8000) & Streamlit (8501) directly
    command: ["python", "scripts/start_app.py"]
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      PORT: "8501"
      FOODFLOW_API_URL: http://127.0.0.1:8000/api
    volumes:
      - foodflow-data:/app/data

volumes:
  foodflow-data:
